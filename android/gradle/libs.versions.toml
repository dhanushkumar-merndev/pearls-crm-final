# Every version is pinned exactly (no ranges, no "+"). Upgrade deliberately, one group at a time.
[versions]
agp = "9.1.0"
kotlin = "2.3.20"
ksp = "2.3.7"
coreKtx = "1.17.0"
activityCompose = "1.12.0"
composeBom = "2026.03.00"
lifecycle = "2.9.4"
navigation = "2.9.6"
room = "2.8.4"
work = "2.11.0"
coroutines = "1.10.2"
serialization = "1.10.0"
okhttp = "4.12.0"
firebaseBom = "34.10.0"
googleServices = "4.4.4"
junit = "4.13.2"
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestOrchestrator = "1.6.1"
espresso = "3.7.0"
uiautomator = "2.3.0"
vico = "3.1.0"

[libraries]
